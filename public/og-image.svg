<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#06060f"/>
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="600" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Background glow -->
  <ellipse cx="300" cy="200" rx="400" ry="300" fill="#7c3aed" fill-opacity="0.12"/>
  <ellipse cx="900" cy="450" rx="350" ry="250" fill="#06b6d4" fill-opacity="0.08"/>

  <!-- Grid -->
  <pattern id="grid" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="white" stroke-opacity="0.03" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Logo icon -->
  <rect x="80" y="80" width="80" height="80" rx="20" fill="#0d0d1a"/>
  <path d="M116 92 L96 124 L112 124 L108 156 L128 124 L112 124 Z" fill="url(#g2)"/>

  <!-- Title -->
  <text x="180" y="135" font-family="Arial, sans-serif" font-size="52" font-weight="900" fill="white">GlanceFlow</text>

  <!-- Main headline -->
  <text x="80" y="280" font-family="Arial, sans-serif" font-size="72" font-weight="900" fill="white">Screenshot to Task,</text>
  <text x="80" y="370" font-family="Arial, sans-serif" font-size="72" font-weight="900" fill="url(#g2)">instantly.</text>

  <!-- Description -->
  <text x="80" y="440" font-family="Arial, sans-serif" font-size="28" fill="#94a3b8">Carica uno screenshot. L'AI estrae tutti i task in 3 secondi.</text>

  <!-- Pills -->
  <rect x="80" y="490" width="180" height="48" rx="24" fill="#7c3aed" fill-opacity="0.2"/>
  <rect x="80" y="490" width="180" height="48" rx="24" stroke="#7c3aed" stroke-opacity="0.4" stroke-width="1" fill="none"/>
  <text x="170" y="521" font-family="Arial, sans-serif" font-size="18" fill="#a78bfa" text-anchor="middle" font-weight="700">✦ AI Powered</text>

  <rect x="278" y="490" width="160" height="48" rx="24" fill="#06b6d4" fill-opacity="0.1"/>
  <rect x="278" y="490" width="160" height="48" rx="24" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="1" fill="none"/>
  <text x="358" y="521" font-family="Arial, sans-serif" font-size="18" fill="#38bdf8" text-anchor="middle" font-weight="700">Free to start</text>

  <!-- URL -->
  <text x="1120" y="580" font-family="Arial, sans-serif" font-size="22" fill="#475569" text-anchor="end">glanceflow.vercel.app</text>
</svg>
